name: React Doctor

# Client health checkup: lint, build, then a dependency freshness and
# vulnerability report written to the run's step summary.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:23 UTC — off-peak, off the hour to dodge scheduler congestion.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkup:
    name: Client checkup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # npm outdated exits 1 when anything is out of date, so it is neutralised.
      - name: Report outdated dependencies
        run: |
          {
            echo "## Outdated dependencies"
            echo ""
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory only here — security.yml is the workflow that fails on findings.
      - name: Report dependency audit
        run: |
          {
            echo "## npm audit (high and above)"
            echo ""
            echo '```'
            npm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
